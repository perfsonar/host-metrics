# WSGI settings
WSGIDaemonProcess host_exporter display-name=host_exporter user=perfsonar group=perfsonar threads=5
WSGIScriptAlias /perfsonar_host_exporter /var/www/html/perfsonar/host_exporter/host_exporter.wsgi process-group=host_exporter application-group=%{GLOBAL}

<Directory /var/www/html/perfsonar/host_exporter>

    SSLRequireSSL

    Require all granted

</Directory>
